<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>BTR native UI progressive MSE test</title>
  <style>
    html,body{margin:0;background:#202124;color:#fff;font-family:sans-serif}
    #bilibili-player{width:960px;margin:20px auto}
    .bpx-player-container{position:relative;width:960px;height:540px;background:#000}
    video{width:100%;height:100%}
    .bpx-player-controls{height:42px;background:#111;padding:8px;box-sizing:border-box}
    #native-mse-result{width:960px;margin:0 auto;white-space:pre-wrap;font:13px/1.5 monospace}
  </style>
</head>
<body>
  <div id="bilibili-player">
    <div class="bpx-player-container"><video muted></video><div class="bpx-player-controls">B 站原生控制栏占位</div>
      <div class="bpx-player-toast-wrap">B 站原生提示占位</div>
      <div class="bpx-player-error-wrap">B 站原生内核报错占位</div>
    </div>
  </div>
  <pre id="native-mse-result">starting</pre>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      // ?codec=hevc|avc|av1 leaves only that video codec, like a browser without the others.
      const prefixes = { hevc: ["hev1", "hvc1"], avc: ["avc1"], av1: ["av01"] }[query.get("codec")];
      if (prefixes) {
        const isTypeSupported = MediaSource.isTypeSupported.bind(MediaSource);
        MediaSource.isTypeSupported = (type) => {
          const codecs = /codecs="([^"]+)"/.exec(String(type))?.[1] || "";
          if (String(type).startsWith("video/") && !prefixes.some((prefix) => codecs.startsWith(prefix))) return false;
          return isTypeSupported(type);
        };
      }
      // ?strictDuration=1 refuses to shorten the duration, as browsers do when buffered HEVC
      // frames run past the new value.
      window.__durationRefusals = 0;
      if (query.get("strictDuration") === "1") {
        const descriptor = Object.getOwnPropertyDescriptor(MediaSource.prototype, "duration");
        Object.defineProperty(MediaSource.prototype, "duration", {
          configurable: true,
          enumerable: descriptor.enumerable,
          get: descriptor.get,
          set(value) {
            if (Number(value) < descriptor.get.call(this)) {
              window.__durationRefusals += 1;
              throw new DOMException("Setting duration below highest presentation timestamp of any buffered coded frames is disallowed.", "InvalidStateError");
            }
            descriptor.set.call(this, value);
          }
        });
      }
    })();
  </script>
  <script src="/src/range-core.js"></script>
  <script src="/src/cdn-resolver.js"></script>
  <script src="/src/sidx.js"></script>
  <script src="/src/idm-downloader.js"></script>
  <script src="/src/native-mse-player.js"></script>
  <script src="/dev/native-mse-test.js"></script>
</body>
</html>
